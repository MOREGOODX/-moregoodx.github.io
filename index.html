<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MORE GOOD — STILL LOADING</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
      font-family: Arial, sans-serif;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: 32px;
      letter-spacing: .15em;
    }

    #time {
      display: block;
      margin-top: 24px;
      font-size: 48px;
      font-variant-numeric: tabular-nums;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: .25em;
    }
  </style>
</head>

<body>

  <main>
    <h1>MORE GOOD</h1>

    <time id="time">--:--:--</time>

    <div class="status">
      STILL LOADING...
    </div>
  </main>

  <script>
    const clock = document.querySelector('#time');

    function updateTime() {
      const now = new Date();

      clock.textContent =
        now.toLocaleTimeString('zh-TW', {
          hour12: false,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
